services:
  # Application Laravel
  hackathon-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"
    networks:
      - hackathon-network
    depends_on:
      - hackathon-db
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  # Base de données MySQL
  hackathon-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hackathon-network

networks:
  hackathon-network:
    driver: bridge

volumes:
  db_data: