version: '3.8'

services:
  # Application Laravel
  hackathon-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    networks:
      - hackathon-network
    depends_on:
      - hackathon-db

  # Base de données MySQL
  hackathon-db:
    image: mysql:8.0
    container_name: hackathon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hackathon-network

networks:
  hackathon-network:
    driver: bridge

volumes:
  db_data:
